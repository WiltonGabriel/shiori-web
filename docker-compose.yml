services:
  shiori-web:
    image: ghcr.io/wiltongabriel/shiori-web:latest
    container_name: shiori-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
