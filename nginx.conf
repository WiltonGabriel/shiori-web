server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para alta performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6].";

    # Cache de longa duração para assets imutáveis com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Desativa cache para o arquivo de injeção dinâmica de variáveis em tempo de execução
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Suporte obrigatório a Single Page Application (SPA)
    # Redireciona qualquer rota recarregada no navegador diretamente para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tratamento de fallback para rotas desconhecidas
    error_page 404 /index.html;
}
