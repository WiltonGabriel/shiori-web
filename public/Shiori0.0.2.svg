<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal: Roxo Profundo / Índigo Tech -->
    <linearGradient id="shioriIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Gradiente de Acento: Coral / Vermelho Vibrante -->
    <linearGradient id="shioriCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5757" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Gradiente para o Fundo Sutil -->
    <radialGradient id="shioriBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0C29" />
    </radialGradient>

    <!-- Sutil Sombra Projetada para Profundidade -->
    <filter id="shioriShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo Escuro Sutil (Contraste Perfeito para Tech/SaaS) -->
  <rect width="500" height="500" rx="100" fill="url(#shioriBg)" />

  <!-- Grupo Principal do Logotipo com Sombra -->
  <g filter="url(#shioriShadow)">
    
    <!-- Elemento 1: O Marcador de Página / Lombada Externa (Formato Sutil em V na base) -->
    <path d="M 165 110 
             H 335 
             A 20 20 0 0 1 355 130 
             V 360 
             L 250 410 
             L 145 360 
             V 130 
             A 20 20 0 0 1 165 110 Z" fill="url(#shioriIndigo)" />

    <!-- Elemento 2: O Recorte Interno / Páginas Dinâmicas -->
    <path d="M 205 150 
             H 295 
             A 10 10 0 0 1 305 160 
             V 325 
             L 250 355 
             L 195 325 
             V 160 
             A 10 10 0 0 1 205 150 Z" fill="#0F0C29" opacity="0.35" />

    <!-- Elemento 3: A Fusão Fluida da Letra "S" / Fita Estilizada do Marcador -->
    <path d="M 285 205 
             C 285 185, 260 175, 235 185 
             C 215 193, 205 212, 220 232 
             C 238 255, 280 265, 280 295 
             C 280 320, 250 330, 225 320 
             C 212 315, 202 305, 198 290" fill="none" stroke="url(#shioriCoral)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Elemento 4: Detalhe de Destaque / Fita Pendurada do Marcador -->
    <path d="M 335 110 
             V 230 
             C 335 245, 345 255, 355 260 
             L 365 265 
             V 110 
             Z" fill="url(#shioriCoral)" opacity="0.9" />

  </g>
</svg>